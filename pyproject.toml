[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aivc"
version = "1.1.0"
description = "AIVC: A Mechanistic Multi-Omics and Grey-Box Temporal Virtual Cell World Model"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0 (source code); CC-BY-NC-SA-4.0 + MODEL_LICENSE.md (model weights and curated data); commercial use requires a separate paid license" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "scanpy>=1.9",
    "anndata>=0.10",
    "transformers>=4.37",
    "rdkit>=2023.9",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["aivc*", "func_python_scripts*"]
